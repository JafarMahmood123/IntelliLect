services:
  classroom-db:
    image: postgres:latest
    container_name: classroom-db
    environment:
      POSTGRES_DB: classroomdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in backend/.env}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d classroomdb" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - intellilect-net

  classroom-service:
    build:
      context: ..
      dockerfile: ClassroomService/Dockerfile
    container_name: classroom-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Database=Host=classroom-db;Port=5432;Database=classroomdb;Username=postgres;Password=${POSTGRES_PASSWORD:?set it in backend/.env}
      - RabbitMq__Host=intellilect-mq
      - RabbitMq__Username=${RABBITMQ_USER:?set it in backend/.env}
      - RabbitMq__Password=${RABBITMQ_PASS:?set it in backend/.env}
      # Live-room control and quiz pushes. Previously hardcoded in the client itself, so this
      # hop could not be pointed anywhere else.
      - StreamingService__BaseUrl=http://streaming-service:8080
      - StreamingService__TimeoutSeconds=10
      # Presented on every call to StreamingService's internal routes; must match its
      # Internal__ApiSecret, whose guard fails closed.
      - StreamingService__InternalApiSecret=${INTERNAL_API_SECRET:?set it in backend/.env}
      - S3Settings__BucketName=intellilect-files
      - S3Settings__ServiceUrl=http://intellilect-s3:9000
      # Browser-reachable MinIO endpoint used only to sign download URLs (host-published port).
      # The service still uploads/reads over the internal ServiceUrl above.
      - S3Settings__PublicServiceUrl=http://localhost:9000
      # The SAME two values MinIO itself and StreamingService's egress read, so they can no
      # longer drift. These were string literals in the composition root, which meant rotating
      # the MinIO password broke every upload, download, recording and summary in THIS service
      # and nothing else — with an InvalidAccessKeyId naming nothing useful.
      - S3Settings__AccessKey=${MINIO_ROOT_USER:?set it in backend/.env}
      - S3Settings__SecretKey=${MINIO_ROOT_PASSWORD:?set it in backend/.env}
      # §10.4: bound what a stopped MinIO can cost. The AWS SDK defaults to a 100s timeout and
      # four retries, so a dependency that is simply down held a user request for minutes.
      - S3Settings__TimeoutSeconds=10
      - S3Settings__MaxErrorRetry=1
      - S3Settings__HealthProbeTimeoutSeconds=3
      - Jwt__SecretKey=${JWT_SECRET_KEY:?set it in backend/.env}
      - Jwt__Issuer=IntelliLect
      - Jwt__Audience=IntelliLect
      # Trigger indexing in RagService (compose service DNS on the shared network).
      # InternalApiSecret must match RagService's INTERNAL_API_SECRET.
      - RagService__BaseUrl=http://rag-service:8080
      - RagService__InternalApiSecret=${INTERNAL_API_SECRET:?set it in backend/.env}
      - RagService__TimeoutSeconds=10
      # LiveAssistantService: session transcripts, and quiz generation from what the teacher just
      # explained. InternalApiSecret must match its INTERNAL_API_SECRET — without it the client
      # sends no header at all and every call is refused, since that guard fails closed.
      # GenerationTimeoutSeconds is separate from TimeoutSeconds because generation runs a language
      # model and takes tens of seconds, while a transcript lookup should never hang that long.
      - LiveAssistant__BaseUrl=http://live-assistant-service:8080
      - LiveAssistant__InternalApiSecret=${INTERNAL_API_SECRET:?set it in backend/.env}
      - LiveAssistant__TimeoutSeconds=10
      - LiveAssistant__GenerationTimeoutSeconds=120
      # Shared secret required on inbound internal calls (e.g. UserManagementService
      # fetching a user's classroom memberships). Must match the caller's value.
      - Internal__ApiSecret=${INTERNAL_API_SECRET:?set it in backend/.env}
    depends_on:
      classroom-db:
        condition: service_healthy
      intellilect-mq:
        condition: service_healthy
    networks:
      - intellilect-net

volumes:
  classroom_db_data:
