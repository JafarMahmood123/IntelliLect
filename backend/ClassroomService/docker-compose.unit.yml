services:
  classroom-db:
    image: postgres:latest
    container_name: classroom-db
    environment:
      POSTGRES_DB: classroomdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Jafar123!
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d classroomdb" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - intellilect-net

  classroom-service:
    build:
      context: ..
      dockerfile: ClassroomService/Dockerfile
    container_name: classroom-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Database=Host=classroom-db;Port=5432;Database=classroomdb;Username=postgres;Password=Jafar123!
      - RabbitMq__Host=intellilect-mq
      - RabbitMq__Username=jafar.mahmood
      - RabbitMq__Password=Jafar123!
      - S3Settings__BucketName=intellilect-files
      - S3Settings__ServiceUrl=http://intellilect-s3:9000
      # Browser-reachable MinIO endpoint used only to sign download URLs (host-published port).
      # The service still uploads/reads over the internal ServiceUrl above.
      - S3Settings__PublicServiceUrl=http://localhost:9000
      - Jwt__SecretKey=MY_SUPER_DUPER_STRONG_UNEXPECTED_SECRET_KEY
      - Jwt__Issuer=IntelliLect
      - Jwt__Audience=IntelliLect
      # Trigger indexing in KnowledgeService (compose service DNS on the shared network).
      # InternalApiSecret must match KnowledgeService's INTERNAL_API_SECRET.
      - KnowledgeService__BaseUrl=http://knowledge-service:8080
      - KnowledgeService__InternalApiSecret=changeme-internal-secret
      - KnowledgeService__TimeoutSeconds=10
      # LiveAssistantService: session transcripts, and quiz generation from what the teacher just
      # explained. InternalApiSecret must match its INTERNAL_API_SECRET — without it the client
      # sends no header at all and every call is refused, since that guard fails closed.
      # GenerationTimeoutSeconds is separate from TimeoutSeconds because generation runs a language
      # model and takes tens of seconds, while a transcript lookup should never hang that long.
      - LiveAssistant__BaseUrl=http://live-assistant-service:8080
      - LiveAssistant__InternalApiSecret=changeme-internal-secret
      - LiveAssistant__TimeoutSeconds=10
      - LiveAssistant__GenerationTimeoutSeconds=120
      # Shared secret required on inbound internal calls (e.g. UserManagementService
      # fetching a user's classroom memberships). Must match the caller's value.
      - Internal__ApiSecret=changeme-internal-secret
    depends_on:
      classroom-db:
        condition: service_healthy
      intellilect-mq:
        condition: service_healthy
    networks:
      - intellilect-net

volumes:
  classroom_db_data:
