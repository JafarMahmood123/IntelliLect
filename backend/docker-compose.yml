services:
  db:
    image: postgres:17-alpine
    container_name: user-management-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Jafar123!
      - POSTGRES_DB=users_db
    ports:
      - "5432:5432"
    healthcheck:
      # ADD THIS
      test: [ "CMD-SHELL", "pg_isready -U postgres -d users_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - user_db_data_v2:/var/lib/postgresql/data

  user-service:
    build:
      context: ./UserManagementService
      dockerfile: Dockerfile
    container_name: user-management-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # SYNCED PASSWORD HERE:
      - ConnectionStrings__Database=Host=db;Port=5432;Database=users_db;Username=postgres;Password=Jafar123!
      - Jwt__SecretKey=MY_SUPER_DUPER_STRONG_UNEXPECTED_SECRET_KEY
      - Jwt__Issuer=IntelliLect
      - Jwt__Audience=IntelliLect
    depends_on:
      - db

  gateway:
    image: nginx:latest
    container_name: intellilect-gateway
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - user-service

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: intellilect-mq
    ports:
      - "5672:5672" # RabbitMQ port
      - "15672:15672" # Management UI (guest/guest)

volumes:
  user_db_data_v2:
