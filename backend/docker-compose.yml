name: intellilect-platform

include:
  - path: ./UserManagementService/docker-compose.unit.yml
  - path: ./EmailService/docker-compose.unit.yml
  - path: ./ClassroomService/docker-compose.unit.yml
  - path: ./StreamingService/docker-compose.unit.yml
  - path: ./KnowledgeService/docker-compose.unit.yml
  - path: ./LiveAssistantService/docker-compose.unit.yml

services:
  intellilect-mq:
    image: rabbitmq:3-management-alpine
    environment:
      # From backend/.env. The four .NET services read the SAME two values as
      # RabbitMq__Username/__Password, so they can no longer drift apart.
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?set RABBITMQ_USER in backend/.env}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:?set RABBITMQ_PASS in backend/.env}
    container_name: intellilect-mq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - intellilect-net

  intellilect-s3:
    image: minio/minio:latest
    container_name: intellilect-s3
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?set MINIO_ROOT_USER in backend/.env}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in backend/.env}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    networks:
      - intellilect-net
    volumes:
      - s3_data:/data

  gateway:
    image: nginx:latest
    container_name: intellilect-gateway
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - user-service
      - classroom-service
    networks:
      - intellilect-net

networks:
  intellilect-net:
    driver: bridge

volumes:
  user_db_data:
  classroom_db_data:
  knowledge_db_data:
  s3_data:
