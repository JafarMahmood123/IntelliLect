services:
  live-assistant-db:
    image: postgres:16-alpine
    container_name: live-assistant-db
    environment:
      POSTGRES_DB: liveassistantdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Jafar123!
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d liveassistantdb" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - live_assistant_db_data:/var/lib/postgresql/data
    networks:
      - intellilect-net

  live-assistant-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: live-assistant-service
    env_file:
      # Optional: copy .env.example to .env to override any of the settings below.
      # The stack still starts without it — the LiveKit dev credentials are set here
      # so the agent can reach the in-stack livekit-server out of the box.
      - path: .env
        required: false
    environment:
      # Reach the LiveKit dev server defined in StreamingService/docker-compose.unit.yml
      # (same intellilect-net). These match its --dev key/secret.
      - LIVEKIT_URL=ws://livekit-server:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=super_secret_livekit_key_for_development
      - AGENT_IDENTITY=ai-assistant
      - TARGET_SAMPLE_RATE=16000
      - TARGET_CHANNELS=1
      # Streaming English STT (LA-2). Small English model + int8 to share RAM with
      # the embedder/brain. The model downloads to the HF cache volume on first use.
      - STT_MODEL=base.en
      - STT_DEVICE=cpu
      - STT_COMPUTE_TYPE=int8
      - STT_LANGUAGE=en
      - HF_HOME=/root/.cache/huggingface
      # Disable HuggingFace's Xet transfer protocol — it stalls the model.bin download at 0 bytes
      # from this container (the plain HTTPS/LFS path works). Prevents IncompleteSnapshotError.
      - HF_HUB_DISABLE_XET=1
      # Idea-boundary drift embeddings (LA-3). Only the deferred boundary_check --live
      # path calls Ollama; host Ollama must run on 0.0.0.0:11434 with the model pulled.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - EMBEDDING_MODEL=qwen3-embedding
      # Host Ollama is CPU-only and swaps between the 7B evaluator and the embedding model,
      # so individual calls can take ~30s+ (model reload). Generous timeouts keep a slow call
      # from crashing the whole session (OllamaEmbeddingError). Real speed comes from keeping
      # both models resident: set OLLAMA_MAX_LOADED_MODELS=2 + OLLAMA_KEEP_ALIVE=-1 on the host.
      - EMBEDDING_TIMEOUT_SECONDS=180
      - EVAL_TIMEOUT_SECONDS=180
      # Material retrieval (LA-3): the evaluator calls KnowledgeService's POST /api/search to
      # fetch relevant chunks for each spoken idea. Without this the evaluator raises
      # RetrievalError and no suggestion is ever produced.
      - KNOWLEDGE_BASE_URL=http://knowledge-service:8080
      # Shared internal secret across the internal mesh. Must match KnowledgeService's
      # INTERNAL_API_SECRET (used for /api/search) AND StreamingService's
      # LiveAssistant__InternalApiSecret (used for /api/internal/sessions). One value everywhere.
      - INTERNAL_API_SECRET=changeme-internal-secret
      - MAX_CONCURRENT_SESSIONS=20
      # Transcript persistence (S-0): durable per-session transcript in the compose DB.
      # entrypoint.sh runs Alembic migrations on start because this is set.
      - TRANSCRIPT_DB_URL=postgresql+asyncpg://postgres:Jafar123!@live-assistant-db:5432/liveassistantdb
      - TRANSCRIPT_PERSIST_BATCH=1
    # Linux does not provide host.docker.internal by default; map it to the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8084:8080"
    depends_on:
      livekit-server:
        condition: service_started
      live-assistant-db:
        condition: service_healthy
    networks:
      - intellilect-net
    volumes:
      # Persist the downloaded faster-whisper model across restarts.
      - live_assistant_hf_cache:/root/.cache/huggingface

volumes:
  live_assistant_hf_cache:
  live_assistant_db_data:
