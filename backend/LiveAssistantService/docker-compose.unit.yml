services:
  live-assistant-db:
    image: postgres:16-alpine
    container_name: live-assistant-db
    environment:
      POSTGRES_DB: liveassistantdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Jafar123!
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d liveassistantdb" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - live_assistant_db_data:/var/lib/postgresql/data
    networks:
      - intellilect-net

  live-assistant-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: live-assistant-service
    env_file:
      # Optional: copy .env.example to .env to override any of the settings below.
      # The stack still starts without it — the LiveKit dev credentials are set here
      # so the agent can reach the in-stack livekit-server out of the box.
      - path: .env
        required: false
    environment:
      # Reach the LiveKit dev server defined in StreamingService/docker-compose.unit.yml.
      # livekit-server runs on HOST networking (for WebRTC), so it is no longer on intellilect-net
      # and cannot be reached by container name — reach it via the host gateway (this service
      # already maps host.docker.internal below). Key/secret match its --dev values.
      - LIVEKIT_URL=ws://host.docker.internal:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=super_secret_livekit_key_for_development
      - AGENT_IDENTITY=ai-assistant
      - TARGET_SAMPLE_RATE=16000
      - TARGET_CHANNELS=1
      # Streaming English STT (LA-2). Small English model + int8 to share RAM with
      # the embedder/brain. The model downloads to the HF cache volume on first use.
      # small.en over base.en: markedly lower word-error rate, especially on proper nouns and
      # short utterances (base.en turned "Hello, Gemini, are you here?" into "Hello Jimmy now are
      # you here?"). ~3x the compute of base.en, which is affordable now that the brain is hosted
      # and the local LLM no longer competes for cores — see STT_CPU_THREADS below.
      - STT_MODEL=small.en
      - STT_DEVICE=cpu
      - STT_COMPUTE_TYPE=int8
      - STT_LANGUAGE=en
      # Beam search instead of greedy. Greedy locks in the first plausible token and is the usual
      # source of confident nonsense on names; 5 is faster-whisper's default.
      - STT_BEAM_SIZE=5
      # Pad Silero VAD's speech chunks so the first/last phoneme is not clipped before the model
      # sees it (the "I love you Manai" class of error).
      - STT_VAD_SPEECH_PAD_MS=200
      # Seed the decoder with names it would otherwise have no reason to spell correctly.
      - STT_INITIAL_PROMPT=Gemini, LiveKit, IntelliLect
      # Do NOT emit interim segments: nothing downstream reads them, yet each one re-transcribes
      # the whole utterance-so-far. Leaving them on roughly doubled STT CPU (measured: 10
      # transcription calls / 31s of audio re-processed for 4 delivered replies) and delayed the
      # final transcription that actually drives the pipeline.
      - STT_EMIT_INTERIM=false
      # Bound the re-transcribed window so a speaker who talks through their pauses cannot grow it
      # without limit. 30s matches Whisper's own native window, so it costs no accuracy.
      - STT_MAX_WINDOW_SECONDS=30
      # Dev-only: log what Whisper heard. This is the one place transcript TEXT reaches the logs.
      # Set false once the STT path is trusted.
      - STT_DEBUG_LOG_TEXT=true
      - HF_HOME=/root/.cache/huggingface
      # Disable HuggingFace's Xet transfer protocol — it stalls the model.bin download at 0 bytes
      # from this container (the plain HTTPS/LFS path works). Prevents IncompleteSnapshotError.
      - HF_HUB_DISABLE_XET=1
      # Idea-boundary drift embeddings (LA-3). Only the deferred boundary_check --live
      # path calls Ollama; host Ollama must run on 0.0.0.0:11434 with the model pulled.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - EMBEDDING_MODEL=qwen3-embedding
      # Host Ollama is CPU-only and swaps between the 7B evaluator and the embedding model,
      # so individual calls can take ~30s+ (model reload). Generous timeouts keep a slow call
      # from crashing the whole session (OllamaEmbeddingError). Real speed comes from keeping
      # both models resident: set OLLAMA_MAX_LOADED_MODELS=2 + OLLAMA_KEEP_ALIVE=-1 on the host.
      - EMBEDDING_TIMEOUT_SECONDS=180
      - EVAL_TIMEOUT_SECONDS=180
      # Material retrieval (LA-3): the evaluator calls KnowledgeService's POST /api/search to
      # fetch relevant chunks for each spoken idea. Without this the evaluator raises
      # RetrievalError and no suggestion is ever produced.
      - KNOWLEDGE_BASE_URL=http://knowledge-service:8080
      # Shared internal secret across the internal mesh. Must match KnowledgeService's
      # INTERNAL_API_SECRET (used for /api/search) AND StreamingService's
      # LiveAssistant__InternalApiSecret (used for /api/internal/sessions). One value everywhere.
      - INTERNAL_API_SECRET=changeme-internal-secret
      - MAX_CONCURRENT_SESSIONS=20
      # Transcript persistence (S-0): durable per-session transcript in the compose DB.
      # entrypoint.sh runs Alembic migrations on start because this is set.
      - TRANSCRIPT_DB_URL=postgresql+asyncpg://postgres:Jafar123!@live-assistant-db:5432/liveassistantdb
      - TRANSCRIPT_PERSIST_BATCH=1
      # --- SMOKE TEST + RAM fit (temporary) ---
      # Small chat model imported into Ollama from a GGUF: fits RAM alongside everything and
      # replies fast on CPU. 1.5B (vs 3B) roughly halves generation time and keeps only ONE small
      # model resident. Must match ollama-warmup's CHAT_MODEL below.
      - EVAL_MODEL=qwen2.5:1.5b-instruct
      # Generation cap, shared by whichever BRAIN_PROVIDER is active. Sized for Gemini: on the
      # 3.x models THINKING tokens are billed against this same budget, so a small cap starves the
      # actual reply (measured: at 128, thinking took 92 and the JSON answer truncated mid-string
      # -> finishReason=MAX_TOKENS -> unparseable -> silent "no feedback"). 1024 leaves room for
      # both. If you switch BRAIN_PROVIDER back to ollama, drop this to ~128 so CPU generation
      # stays quick — the local model has no thinking budget to pay for.
      - EVAL_MAX_TOKENS=1024
      # Send each spoken idea's raw transcript straight to the LLM and push the reply to the
      # teacher, bypassing retrieval/evaluation/pacing. Set false to restore the real assistant.
      - ASSISTANT_SMOKE_TEST=true
      # --- Brain provider ---
      # Use the hosted Gemini API for fast replies instead of the local CPU model. The API key is a
      # SECRET and lives in .env (GEMINI_API_KEY), not here. Model/params are configurable:
      # GEMINI_MODEL, EVAL_MAX_TOKENS, EVAL_TEMPERATURE, and GEMINI_GENERATION_CONFIG_JSON (extra
      # request fields). Set BRAIN_PROVIDER=ollama to fall back to the local model.
      - BRAIN_PROVIDER=gemini
      # Model choice is quota-driven, not preference: this project's key has free-tier
      # limit: 0 on gemini-2.0-flash / -lite (every call 429s), and gemini-2.5-flash is 404
      # "no longer available to new users". The *-latest aliases are the ones that actually
      # serve. flash-lite-latest measured fastest end to end (~1.1s vs ~1.6s for flash-latest)
      # and, at thinkingLevel=low, spends 0 tokens on thinking — all of the budget goes to the
      # answer. Re-check with `GET /v1beta/models` if calls start failing.
      - GEMINI_MODEL=gemini-flash-lite-latest
      # Merged into generationConfig by GeminiBrainClient. Gemini 3.x cannot disable thinking
      # outright (thinkingBudget:0 is a 2.5-era field and 400s here); thinkingLevel=low is the
      # floor and keeps latency and token spend down. Extra request fields (topP, topK,
      # stopSequences, …) can be added here without touching code.
      - 'GEMINI_GENERATION_CONFIG_JSON={"thinkingConfig":{"thinkingLevel":"low"}}'
      # Smoke test: even ONE recognized word forms an idea, so a quiet/choppy mic that only lands
      # a single word ("Hello") still triggers an LLM reply. Raise back toward 20 for the real assistant.
      - BOUNDARY_MIN_TOKENS=1
      # Wait longer for a pause before finalizing a speech segment, so words spoken with small gaps
      # group into one clip Whisper can transcribe (short sub-second clips come back empty). Default 0.8.
      - STT_PAUSE_SECONDS=1.5
      # Keep the embedding model OUT of Ollama so the chat model stays resident (no model-swap).
      - BOUNDARY_USE_EMBEDDER=false
      # --- CPU core partitioning (latency) ---
      # The old 2/6 split existed because STT and a LOCAL 7B/1.5B model both wanted all 8 cores and
      # thrashed. With BRAIN_PROVIDER=gemini the brain is a hosted API — generation uses no local
      # cores at all — so that 6-core reservation is dead and STT gets the machine. This is what
      # pays for small.en + beam_size=5. EVAL_NUM_THREAD is kept only for the ollama fallback;
      # it is ignored while the provider is gemini. Revert to 2/6 if you switch back to ollama.
      - STT_CPU_THREADS=6
      - EVAL_NUM_THREAD=6
    # Linux does not provide host.docker.internal by default; map it to the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8084:8080"
    depends_on:
      livekit-server:
        condition: service_started
      live-assistant-db:
        condition: service_healthy
    networks:
      - intellilect-net
    volumes:
      # Persist the downloaded faster-whisper model across restarts.
      - live_assistant_hf_cache:/root/.cache/huggingface

  # NOTE: the `ollama-warmup` service was removed — with BRAIN_PROVIDER=gemini the brain is a
  # hosted API and BOUNDARY_USE_EMBEDDER=false keeps the embedder off, so NOTHING in this service
  # calls host Ollama. Keeping the warmup was actively harmful: the assistant gated its startup on
  # `ollama-warmup: service_healthy`, and that healthcheck only passes once the host Ollama has
  # loaded the chat model — so a host with Ollama stopped (or the model not pulled) would block
  # the assistant from starting at all, for a dependency it no longer uses. It also pinned a model
  # in host RAM for nothing.
  #
  # To go back to the local brain: set BRAIN_PROVIDER=ollama, drop EVAL_MAX_TOKENS to ~128, and
  # restore this service from scripts/ollama-warmup.sh (kept in the repo) plus the depends_on entry.

volumes:
  live_assistant_hf_cache:
  live_assistant_db_data:
