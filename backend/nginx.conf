worker_processes 1;

events { 
    worker_connections 1024; 
}

http {
    sendfile on;

    # Classroom material uploads pass through this gateway, so nginx's 1 MB DEFAULT was the real
    # upload limit — every file above it was refused here with a bare HTML 413 that never reached
    # the service and that the frontend could not parse. This is deliberately a little above
    # ClassroomService's Uploads:MaxFileSizeBytes (50 MB), so the APPLICATION refuses oversized
    # files with a typed error and nginx only catches what the application would refuse anyway.
    # Raising the app limit past this line silently moves enforcement back to nginx — change both.
    client_max_body_size 64m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream user-service-proxy {
        server user-management-service:8080;
    }

    upstream classroom-service-proxy {
        server classroom-service:8080;
    }

    upstream streaming-service-proxy {
        server streaming-service:8080;
    }

    server {
        listen 80;

        # User Management API
        location /api/ {
            proxy_pass         http://user-service-proxy/api/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Classroom Service API
        location /api/classrooms {
            proxy_pass         http://classroom-service-proxy/api/classrooms;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Streaming Service REST API (Join/Leave/History)
        location /api/streams {
            proxy_pass         http://streaming-service-proxy/api/streams; 
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # SignalR Hubs (Chat/Reactions/Hand Raise)
        location /hubs/stream {
            proxy_pass         http://streaming-service-proxy/hubs/stream;
            
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            
            proxy_set_header   Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        location /scalar {
            proxy_pass         http://user-service-proxy;
            proxy_set_header   Host $host;
        }

        location /openapi {
            proxy_pass         http://user-service-proxy;
            proxy_set_header   Host $host;
        }

        location /health {
            return 200 'Gateway is alive';
            add_header Content-Type text/plain;
        }
    }
}