worker_processes 1;

events { 
    worker_connections 1024; 
}

http {
    sendfile on;

    upstream user_service {
        server user-management-service:8080;
    }

    upstream classroom_service {
        server classroom-service:8080;
    }

    upstream streaming_service {
        server streaming-service:8080;
    }

    server {
        listen 80;

        location /api/ {
            proxy_pass         http://user_service/api/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/classrooms {
            proxy_pass http://classroom-service:8080;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/streams {
            proxy_pass         http://streaming_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /scalar {
            proxy_pass         http://user_service;
            proxy_set_header   Host $host;
        }

        location /openapi {
            proxy_pass         http://user_service;
            proxy_set_header   Host $host;
        }

        location /health {
            return 200 'Gateway is alive';
            add_header Content-Type text/plain;
        }
    }
}