logging:
  level: info

port: 7880
bind_addresses:
  - ""
rtc:
  tcp_port: 7881
  port_range_start: 51000
  port_range_end: 51050
  use_external_ip: true
  enable_loopback_candidate: true

egress:
  s3:
    access_key: "testuser"
    secret_key: "testpassword123!"
    region: "us-east-1"
    endpoint: "http://intellilect-s3:9000"
    bucket: "intellilect-files"
    force_path_style: true

# Egress lifecycle webhooks -> StreamingService (R-1). LiveKit signs each POST with the api_key
# below; the receiver verifies it with the matching secret in `keys`.
webhook:
  api_key: devkey
  urls:
    - http://streaming-service:8080/api/webhooks/livekit

keys:
  devkey: super_secret_livekit_key_for_development
