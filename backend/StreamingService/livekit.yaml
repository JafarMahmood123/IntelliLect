logging:
  level: info

# Redis is required for the server to dispatch recording jobs to the egress worker. Both this
# server and the egress worker run on HOST networking, so they share the host loopback and reach
# livekit-redis (bound to 127.0.0.1) here. Without redis, egress requests are never handed off.
redis:
  address: 127.0.0.1:6379

port: 7880
bind_addresses:
  - ""
rtc:
  tcp_port: 7881
  # Single UDP port (not a range). Docker's userland proxy mangles/drops UDP across a large
  # published port range, which surfaces as "dtls timeout" on the media transport and clients
  # never actually get audio/video (endless reconnects). One multiplexed UDP port is LiveKit's
  # documented Docker setup and only needs a single "7882:7882/udp" publish.
  udp_port: 7882
  # WebRTC media (ICE) advertising.
  #
  # node_ip is deliberately NOT set here. It lives in exactly one place — LIVEKIT_HOST_IP in
  # backend/.env, applied via the --node-ip flag in compose. Under --dev the flag overrides this
  # yaml anyway, so a node_ip key here is dead config that only invites the two copies to drift
  # apart (and a browser offered candidates on an address it did not signal to gets dropped ~13s
  # after joining, which reads as being kicked out of the session).
  #
  # use_external_ip:false — with it true LiveKit STUN-discovers the machine's PUBLIC IP and offers
  # that as the media candidate, which a local browser cannot route to. Flip it to true ONLY for a
  # real server deployment with a public IP: there it is the portable choice, since the container
  # then discovers its own reachable address at boot and needs no LIVEKIT_HOST_IP at all.
  #
  # enable_loopback_candidate must stay true, or LiveKit will not offer the 127.0.0.1 candidate
  # that the default loopback mode depends on.
  use_external_ip: false
  enable_loopback_candidate: true

# Embedded TURN relay. This is what makes media survive a client whose address LiveKit cannot reach
# back to — the case that breaks the host-candidate path entirely:
#
# ICE needs BOTH directions to validate. The browser can always reach LiveKit (loopback is
# forwarded into the Docker Desktop VM), which is why the server logs show its binding requests
# arriving and being answered. The reverse fails: the browser advertises the host's own addresses
# (LAN, and a VPN interface when one is up), and from inside the Desktop VM LiveKit can reach
# neither, so every host pair dies with responsesReceived:0 and the client is dropped ~13s later.
#
# A relay removes that requirement. The browser ALLOCATES on the TURN server over an outbound
# connection to loopback, and media flows through the allocation — LiveKit never has to originate a
# packet toward the client, so it no longer matters which interfaces the client is advertising or
# whether a VPN is shaping that choice. ICE still prefers a direct host pair when one works, so
# this costs nothing when the direct path is available: it is a fallback, not a detour.
#
# No TLS here on purpose: tls_port needs a real certificate and domain, and the browser only ever
# talks to this over loopback on a dev box. Do NOT copy this section to a deployment reachable off
# this machine — there, TURN belongs on tls_port with a real cert.
turn:
  enabled: true
  # The browser reaches this at 3478. Note it binds on ALL interfaces, unlike the media port, which
  # node_ip pins to loopback — so this is reachable whichever address the client ends up using.
  udp_port: 3478
  domain: localhost
  # One relay port is consumed per client that falls back to relay. The default range is THREE
  # (30000-30002), which a teacher plus two students would exhaust — and an exhausted range fails
  # exactly like the problem this is here to solve, which would be a miserable thing to debug twice.
  # These are only ever used between the TURN server and LiveKit's own media engine on this host,
  # never by the browser, so a wide range costs nothing and is not published anywhere.
  relay_range_start: 30000
  relay_range_end: 30100

# NOTE: The LiveKit *server* config has no top-level `egress` section — that field
# belongs to the separate LiveKit Egress service's config. Placing it here makes
# livekit-server fail to parse the config and exit on startup (which took the whole
# live-session flow down). Egress/recording S3 settings are supplied to StreamingService
# via the Egress__S3__* env vars and require a livekit/egress container to actually run;
# without it, StreamingService logs a warning and continues without recording.

# Egress/room lifecycle webhooks -> StreamingService (R-0 start on room_started, R-1 ready on
# egress_ended). LiveKit signs each POST with the api_key below; the receiver verifies it with the
# matching secret in `keys`. This server is on HOST networking so it cannot resolve the
# streaming-service container name — it posts to the service's host-published port (8085->8080).
webhook:
  api_key: devkey
  urls:
    - http://127.0.0.1:8085/api/webhooks/livekit

keys:
  devkey: super_secret_livekit_key_for_development
