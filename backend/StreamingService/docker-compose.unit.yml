services:
  streaming-db:
    image: postgres:17-alpine
    container_name: streaming-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Jafar123!
      - POSTGRES_DB=streaming_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d streaming_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5435:5432"
    networks:
      - intellilect-net
    volumes:
      - streaming_db_data:/var/lib/postgresql/data

  # Redis backs the LiveKit server <-> egress worker coordination (egress jobs are dispatched
  # over Redis pub/sub). Host networking so the host-networked livekit-server and egress
  # containers both reach it at 127.0.0.1:6379 with no cross-namespace NAT. Bound to loopback
  # so it is not exposed on the LAN. No persistence needed — it is pure coordination state.
  livekit-redis:
    image: redis:7-alpine
    container_name: livekit-redis
    command: ["redis-server", "--bind", "127.0.0.1", "--save", "", "--appendonly", "no"]
    network_mode: host
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  livekit-server:
    image: livekit/livekit-server:latest
    container_name: livekit-server
    # HOST NETWORKING (not bridge + published ports). WebRTC host candidates only work when
    # LiveKit's media sockets live in the host network namespace: with Docker's bridge + NAT,
    # LiveKit's STUN replies leave with the container IP (172.18.x) instead of the advertised
    # node-ip, the browser's ICE agent rejects them, and every media pair fails ("could not
    # establish pc connection") — kicking participants out.
    #
    # CAVEAT — DOCKER DESKTOP: the above holds on native Docker Engine, where "host" is THIS
    # machine. On Docker Desktop (`docker info` -> Name: docker-desktop) "host" is the Desktop
    # VM's namespace instead, whose interfaces are 192.168.65.x / 172.1x.0.1 / 127.0.0.1 — the
    # machine's LAN IP does NOT exist there. LiveKit then advertises a node-ip it never bound
    # (verified: /proc/net/udp showed 7882 on 172.17.0.1, 172.18.0.1, 192.168.65.6, 192.168.65.9,
    # 127.0.0.1 — no 192.168.105.28), so every ICE pair fails, the browser times out after ~13s
    # and closes the signal socket. LiveKit logs that as reason=SIGNAL_SOURCE_CLOSE with
    # connectionType=unknown / sessionDuration=0s, and the user experiences it as being KICKED
    # OUT of the session on a ~13s loop.
    network_mode: host
    command:
      - --dev
      # The address browsers are told to send WebRTC media to. Single source of truth is
      # LIVEKIT_HOST_IP in backend/.env (defaulted here so a fresh clone with no .env still runs).
      # Defaults to 127.0.0.1: Docker Desktop forwards 127.0.0.1:7882/udp into the VM, so loopback
      # is the one address that is both advertised AND actually reachable. It is also portable —
      # loopback means the same thing on every machine, so this moves hosts with no edit.
      # TRADE-OFF: only a browser on THIS machine can connect. See .env for the LAN-IP path.
      - --node-ip
      - ${LIVEKIT_HOST_IP:-127.0.0.1}
      - --config
      - /livekit.yaml
    volumes:
      - ./livekit.yaml:/livekit.yaml
    environment:
      - LIVEKIT_NODE_IP=${LIVEKIT_HOST_IP:-127.0.0.1}
      - LiveKit__ApiKey=devkey
      - LiveKit__ApiSecret=super_secret_livekit_key_for_development
      - LiveKit__Host=ws://${LIVEKIT_HOST_IP:-127.0.0.1}:7880
      - LOG_LEVEL=info,pion:warn,transport:warn
    # Fail loudly if the media server is down. A bad livekit.yaml previously let this
    # container exit(0) while streaming-service came up regardless, silently bouncing
    # everyone out of live sessions. The HTTP signal port returns "OK" once serving;
    # the image ships busybox wget (no curl). start_period covers STUN/external-IP setup.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7880/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      livekit-redis:
        condition: service_healthy

  # LiveKit Egress worker (R-0): records room-composite MP4s straight to MinIO. Runs headless
  # Chrome to composite the room, so it needs CAP_SYS_ADMIN + a larger /dev/shm. Host networking
  # for the same reason as livekit-server — the egress Chrome joins the room over WebRTC and would
  # otherwise hit the same NAT wall. Config in egress.yaml (Redis + LiveKit ws, all on localhost).
  livekit-egress:
    image: livekit/egress:latest
    container_name: livekit-egress
    network_mode: host
    cap_add:
      - CAP_SYS_ADMIN
    shm_size: "1gb"
    environment:
      - EGRESS_CONFIG_FILE=/egress.yaml
    volumes:
      - ./egress.yaml:/egress.yaml
    restart: unless-stopped
    depends_on:
      livekit-redis:
        condition: service_healthy
      livekit-server:
        condition: service_healthy

  streaming-service:
    build:
      context: ..
      dockerfile: StreamingService/Dockerfile
    container_name: streaming-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Database=Host=streaming-db;Port=5432;Database=streaming_db;Username=postgres;Password=Jafar123!
      - RabbitMq__Host=intellilect-mq
      - RabbitMq__Username=jafar.mahmood
      - RabbitMq__Password=Jafar123!
      - Jwt__SecretKey=MY_SUPER_DUPER_STRONG_UNEXPECTED_SECRET_KEY
      - Jwt__Issuer=IntelliLect
      - Jwt__Audience=IntelliLect
      - LiveKit__ApiKey=devkey
      - LiveKit__ApiSecret=super_secret_livekit_key_for_development
      # The ws URL handed to BROWSERS. Same variable as livekit-server's --node-ip on purpose: if
      # these two ever diverge, the browser signals to one address and is offered media candidates
      # on another, ICE fails, and participants are dropped ~13s after joining (looks like a kick).
      # Set LIVEKIT_HOST_IP once in backend/.env — never edit these two independently.
      - LiveKit__Host=ws://${LIVEKIT_HOST_IP:-127.0.0.1}:7880
      # ApiUrl is the SERVER-SIDE endpoint this service uses for LiveKit's Room/Egress twirp APIs.
      # livekit-server runs on HOST networking (for WebRTC), so it is no longer on intellilect-net
      # and cannot be reached by container name — this service reaches it via the host gateway.
      - LiveKit__ApiUrl=http://host.docker.internal:7880
      # LiveAssistantService trigger (LA-6): notify it on session start/end. Secret
      # must match live-assistant-service's INTERNAL_API_SECRET. Same intellilect-net.
      - LiveAssistant__BaseUrl=http://live-assistant-service:8080
      # Shared internal secret — must match live-assistant-service's INTERNAL_API_SECRET
      # (which is also what live-assistant presents to KnowledgeService). One value everywhere.
      - LiveAssistant__InternalApiSecret=changeme-internal-secret
      # Session recording via LiveKit Room Composite Egress (R-0). This endpoint is used BY the
      # host-networked egress worker to upload the MP4 to MinIO, so it must be an address egress
      # can reach from the host namespace — MinIO's host-published port, NOT the intellilect-s3
      # container name (which egress, on host networking, cannot resolve).
      - Egress__Enabled=true
      - Egress__KeyTemplate=recordings/{room_name}/{time}.mp4
      # Modest composite encode so the egress pipeline doesn't starve/freeze at finalization on
      # this virtualized host (Docker Desktop). Raise on a beefier machine for a sharper capture.
      - Egress__Width=1280
      - Egress__Height=720
      - Egress__Framerate=15
      - Egress__S3__Bucket=intellilect-files
      - Egress__S3__Region=us-east-1
      - Egress__S3__AccessKey=testuser
      - Egress__S3__Secret=testpassword123!
      - Egress__S3__Endpoint=http://127.0.0.1:9000
    # livekit-server (host networking) delivers its egress/room webhooks to this service. It can
    # only reach it via a host-published port, so expose 8080 on the host as 8085.
    ports:
      - "8085:8080"
    # Reach the host-networked livekit-server via the host gateway (host.docker.internal).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      streaming-db:
        condition: service_healthy
      intellilect-mq:
        condition: service_healthy
      livekit-server:
        condition: service_healthy
    networks:
      - intellilect-net

volumes:
  streaming_db_data:
