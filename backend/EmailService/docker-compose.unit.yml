services:
  email-service:
    build:
      context: ..
      dockerfile: EmailService/Dockerfile
    container_name: email-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - RabbitMq__Host=intellilect-mq
      # Required: the service reads these rather than carrying a hardcoded credential, and
      # refuses to start without them. Must match RABBITMQ_DEFAULT_USER/PASS on the broker.
      - RabbitMq__Username=${RABBITMQ_USER:?set it in backend/.env}
      - RabbitMq__Password=${RABBITMQ_PASS:?set it in backend/.env}
      - EmailSettings__SenderName=IntelliLect
      - EmailSettings__SenderEmail=${SMTP_SENDER_EMAIL:?set it in backend/.env}
      - EmailSettings__AppPassword=${SMTP_APP_PASSWORD:?set it in backend/.env}
      - EmailSettings__SmtpHost=smtp.gmail.com
      - EmailSettings__SmtpPort=587
    depends_on:
      intellilect-mq:
        condition: service_healthy
    networks:
      - intellilect-net
