services:
  user-db:
    image: postgres:17-alpine
    container_name: user-management-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set it in backend/.env}
      - POSTGRES_DB=users_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d users_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - intellilect-net
    volumes:
      - user_db_data:/var/lib/postgresql/data

  user-service:
    build:
      context: ..
      dockerfile: UserManagementService/Dockerfile
    container_name: user-management-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Database=Host=user-management-db;Port=5432;Database=users_db;Username=postgres;Password=${POSTGRES_PASSWORD:?set it in backend/.env}
      - RabbitMq__Host=intellilect-mq
      # Required: the service reads these rather than carrying a hardcoded credential, and
      # refuses to start without them. Must match RABBITMQ_DEFAULT_USER/PASS on the broker.
      - RabbitMq__Username=${RABBITMQ_USER:?set it in backend/.env}
      - RabbitMq__Password=${RABBITMQ_PASS:?set it in backend/.env}
      - Jwt__SecretKey=${JWT_SECRET_KEY:?set it in backend/.env}
      # --- Downstream /api/internal clients -------------------------------------------------
      # All four are validated at startup: a missing BaseUrl or InternalApiSecret refuses the
      # boot naming the key, rather than producing a super-admin page of empty panels and a
      # series of 401s that read as the other service being down.
      #
      # LiveAssistant__* and RagService__* were MISSING here. Their clients defaulted the secret
      # to "" and then omitted the header, so every call UMS made to those two services was
      # refused — the far side fails closed by design. The knowledge-base admin view and the
      # live-session monitor's assistant half were 401ing in this configuration.
      #
      # Read a user's classroom memberships for the super admin user-detail view.
      # InternalApiSecret must match ClassroomService's Internal__ApiSecret.
      - ClassroomService__BaseUrl=http://classroom-service:8080
      - ClassroomService__InternalApiSecret=${INTERNAL_API_SECRET:?set it in backend/.env}
      - ClassroomService__TimeoutSeconds=10
      # Live-session monitor reads StreamingService's internal routes, which are secret-guarded
      # and fail closed. Same shared value as above. The 5s timeouts are deliberate: this feeds a
      # live view that must degrade rather than block (4أ). They were hard-coded in C# while
      # nothing read the configured value — now they live here, visible and adjustable.
      - StreamingService__BaseUrl=http://streaming-service:8080
      - StreamingService__InternalApiSecret=${INTERNAL_API_SECRET:?set it in backend/.env}
      - StreamingService__TimeoutSeconds=5
      - LiveAssistant__BaseUrl=http://live-assistant-service:8080
      - LiveAssistant__InternalApiSecret=${INTERNAL_API_SECRET:?set it in backend/.env}
      - LiveAssistant__TimeoutSeconds=5
      # Super-admin knowledge-base management (list/reindex/delete documents).
      - RagService__BaseUrl=http://rag-service:8080
      - RagService__InternalApiSecret=${INTERNAL_API_SECRET:?set it in backend/.env}
      - RagService__TimeoutSeconds=10
    depends_on:
      user-db:
        condition: service_healthy
      intellilect-mq:
        condition: service_healthy
    networks:
      - intellilect-net
